# Linux packaging target (xai-1). Standalone on purpose: electron-builder does
# NOT merge multiple --config files, and `extends` on the mac config would drag
# in its mac/dmg sections and the darwin-only cursor-sdk extraResources path.
# Same identity, file set and CLI resource as electron-builder.yml; only the
# platform-specific parts differ. The mac configs are untouched.
#
# Targets: `dir` (unpacked, run in place) and `tar.gz` are the primary outputs.
# AppImage is optional: it needs FUSE at run time, which container hosts often
# lack, so it is not part of the default script.
appId: build.raft.desktop
productName: Raft Desktop
artifactName: Raft-Desktop-${version}-linux-${arch}.${ext}
directories:
  output: release-linux
  buildResources: build
files:
  - dist/**
  - package.json
  - build/tray-icon.png
  - build/tray-icon@2x.png
  - "!**/*.map"
  - "!**/runtime-assets{,/**}"
extraResources:
  - from: ../../packages/cli/dist/index.js
    to: cli/index.js
  # The CLI bundle is ESM. Next to `cli/index.js` it needs the package.json that says
  # `"type": "module"`, or Node/Electron parse it as CommonJS and (under
  # ELECTRON_RUN_AS_NODE) exit 0 silently on the first `import`: every `raft` command run
  # by a Desktop-hosted agent printed nothing (0.2.4 / 0.2.5 packages).
  - from: ../../packages/cli/dist/package.json
    to: cli/package.json
  # Cursor SDK runtime assets, staged for linux by
  # `pnpm --filter @botiverse/raft-daemon build:cursor-assets -- --target linux-x64`.
  # Keep the version segment in step with packages/daemon/cursor-sdk-assets.lock.json.
  - from: ../../packages/daemon/runtime-assets/cursor/1.0.36/linux-${arch}
    to: cursor-sdk
  # Standalone Computer (single-file raft-computer + photon wasm + version.txt), staged by
  # `pnpm run stage:computer*` (scripts/stageBundledComputer.mjs). The app copies it to
  # ~/.local/bin on demand (src/app/standalone/bundledInstall.ts); it is never run from here.
  - from: build/computer/linux-${arch}
    to: computer
protocols:
  - name: Raft
    schemes:
      - raft
linux:
  # Without this the executable is named after the scoped package
  # ("@botiverseraft-desktop-electron").
  executableName: raft-desktop
  category: Network
  icon: build/icon.png
  maintainer: Raft
  synopsis: Raft Desktop
  target:
    - target: dir
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
