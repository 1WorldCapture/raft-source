# Persistent access log (task #37). The web image symlinks
# /var/log/nginx/access.log to /dev/stdout, which dies with each container
# recreation; this ADDS a file destination that survives it. nginx
# access_log is additive, so `docker logs` output is unchanged.
# Mounted by docker-compose.yml; rotate with logrotate/raft-nginx-access.
access_log /var/log/nginx-persist/access.log main;
